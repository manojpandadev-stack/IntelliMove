server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  mvc:
    contentnegotiation:
      media-types:
        openmetrics: application/openmetrics-text; version=1.0.0
  web:
    resources:
      add-mappings: false
  application:
    name: intellimove-auth
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:intellimove}_auth
    username: ${POSTGRES_USER:intellimove}
    password: ${POSTGRES_PASSWORD:changeme_postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

# Publish the transactional-outbox backlog quickly so newly registered users
# get their user-service profile within ~1 second (default is 5000ms).
outbox:
  poll-interval-ms: 1000

jwt:
  secret: ${JWT_SECRET:changeme_jwt_secret_min_32_chars_long!!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    com.intellimove: DEBUG
    org.springframework.security: INFO
