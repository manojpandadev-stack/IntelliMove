apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellimove-auth
  namespace: intellimove
  labels:
    app: intellimove-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intellimove-auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: intellimove-auth
    spec:
      containers:
        - name: auth
          image: intellimove/auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: AUTH_SERVICE_PORT
              value: "8081"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: intellimove-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: intellimove-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              value: "intellimove_auth"
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: intellimove-config
                  key: POSTGRES_USER
            - name: postgres_password
              valueFrom:
                secretKeyRef:
                  name: intellimove-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: intellimove-config
                  key: REDIS_HOST
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: intellimove-secrets
                  key: JWT_SECRET
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: intellimove-config
                  key: KAFKA_BROKERS
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: intellimove
spec:
  selector:
    app: intellimove-auth
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-hpa
  namespace: intellimove
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intellimove-auth
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
