services:
  # ── Databases ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellimove
      POSTGRES_USER: intellimove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellimove"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Messaging ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── API Gateway ──
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_PORT: 8081
      USER_SERVICE_PORT: 8082
      DRIVER_SERVICE_PORT: 8083
      RIDE_SERVICE_PORT: 8084
      LOCATION_SERVICE_PORT: 8085
      PAYMENT_SERVICE_PORT: 8086
      NOTIFICATION_SERVICE_PORT: 8087
      AI_OPS_SERVICE_PORT: 8088
      # Route overrides: the packaged gateway routes to http://localhost:<port>
      # (designed for Docker Desktop host networking). On a standard bridge
      # network the routes must target the compose service DNS names instead.
      # SPRING_APPLICATION_JSON is the only env mechanism that can replace the
      # whole routes list; it must define every route completely (id, uri,
      # predicates, filters) or Spring binding rejects the partial indexes.
      SPRING_APPLICATION_JSON: '{"spring":{"cloud":{"gateway":{"routes":[{"id":"auth-service","uri":"http://auth-service:8081","predicates":["Path=/api/v1/auth/**"],"filters":[{"name":"RequestRateLimiter","args":{"redis-rate-limiter.replenishRate":"10","redis-rate-limiter.burstCapacity":"20"}}]},{"id":"user-service","uri":"http://user-service:8082","predicates":["Path=/api/v1/users/**"],"filters":[{"name":"StripPrefix","args":{"parts":"0"}},{"name":"RequestRateLimiter","args":{"redis-rate-limiter.replenishRate":"30","redis-rate-limiter.burstCapacity":"60"}}]},{"id":"driver-service","uri":"http://driver-service:8083","predicates":["Path=/api/v1/drivers/**"],"filters":[{"name":"StripPrefix","args":{"parts":"0"}}]},{"id":"ride-service","uri":"http://ride-service:8084","predicates":["Path=/api/v1/rides/**"],"filters":[{"name":"StripPrefix","args":{"parts":"0"}}]},{"id":"location-service","uri":"http://location-service:8085","predicates":["Path=/api/v1/location/**"],"filters":[{"name":"StripPrefix","args":{"parts":"0"}}]},{"id":"payment-service","uri":"http://payment-service:8086","predicates":["Path=/api/v1/payments/**"],"filters":[{"name":"StripPrefix","args":{"parts":"0"}}]},{"id":"notification-service","uri":"http://notification-service:8087","predicates":["Path=/api/v1/notifications/**"],"filters":[{"name":"StripPrefix","args":{"parts":"0"}}]},{"id":"ai-ops-service","uri":"http://ai-ops-service:8088","predicates":["Path=/api/v1/ai/**"],"filters":[{"name":"StripPrefix","args":{"parts":"0"}}],"metadata":{"response-timeout":"150s","connect-timeout":"5000"}}]}}}}'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Backend Services ──
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
    ports:
      - "8081:8081"
    environment:
      AUTH_SERVICE_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: intellimove
      POSTGRES_USER: intellimove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.user
    ports:
      - "8082:8082"
    environment:
      USER_SERVICE_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: intellimove
      POSTGRES_USER: intellimove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  driver-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.driver
    ports:
      - "8083:8083"
    environment:
      DRIVER_SERVICE_PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: intellimove
      POSTGRES_USER: intellimove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ride-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ride
    ports:
      - "8084:8084"
    environment:
      RIDE_SERVICE_PORT: 8084
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: intellimove
      POSTGRES_USER: intellimove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  location-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.location
    ports:
      - "8085:8085"
    environment:
      LOCATION_SERVICE_PORT: 8085
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      RIDE_SERVICE_URL: http://ride-service:8084
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.payment
    ports:
      - "8086:8086"
    environment:
      PAYMENT_SERVICE_PORT: 8086
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: intellimove
      POSTGRES_USER: intellimove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.notification
    ports:
      - "8087:8087"
    environment:
      NOTIFICATION_SERVICE_PORT: 8087
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: intellimove
      POSTGRES_USER: intellimove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ai-ops-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.aiops
    ports:
      - "8088:8088"
    environment:
      AI_OPS_SERVICE_PORT: 8088
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_AI_API_KEY: ${SPRING_AI_API_KEY:-sk-placeholder}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long!!}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Monitoring ──
  prometheus:
    image: prom/prometheus:v2.39.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/intellimove-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: intellimove
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
