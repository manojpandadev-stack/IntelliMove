server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: intellimove-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: http://localhost:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        - id: user-service
          uri: http://localhost:${USER_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60

        - id: driver-service
          uri: http://localhost:${DRIVER_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/drivers/**
          filters:
            - StripPrefix=0

        - id: ride-service
          uri: http://localhost:${RIDE_SERVICE_PORT:8084}
          predicates:
            - Path=/api/v1/rides/**
          filters:
            - StripPrefix=0

        - id: location-service
          uri: http://localhost:${LOCATION_SERVICE_PORT:8085}
          predicates:
            - Path=/api/v1/location/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: http://localhost:${PAYMENT_SERVICE_PORT:8086}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0

        - id: notification-service
          uri: http://localhost:${NOTIFICATION_SERVICE_PORT:8087}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

        - id: ai-ops-service
          uri: http://localhost:${AI_OPS_SERVICE_PORT:8088}
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - StripPrefix=0
          metadata:
            response-timeout: 150s
            connect-timeout: 5000

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:changeme_jwt_secret_min_32_chars_long!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    gateway:
      enabled: true
