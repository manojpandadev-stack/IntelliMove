server:
  port: ${LOCATION_SERVICE_PORT:8085}

spring:
  mvc:
    contentnegotiation:
      media-types:
        openmetrics: application/openmetrics-text; version=1.0.0
  web:
    resources:
      add-mappings: false
  application:
    name: intellimove-location
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET:changeme_jwt_secret_min_32_chars_long!!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

matching:
  max-search-radius-km: 10.0
  max-candidates: 10
  distance-weight: 0.4
  rating-weight: 0.3
  trip-count-weight: 0.2
  fairness-weight: 0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
